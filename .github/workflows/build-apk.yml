name: Compilar APK Android TV (Downloader)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências e Compilar Web
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: 'gradle'

      - name: Conceder permissão ao gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK Android
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Publicar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: NovaIPTV-Pro-AndroidTV
          path: android/app/build/outputs/apk/debug/app-debug.apk
