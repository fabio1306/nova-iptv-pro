name: Compilar APK Android TV (Downloader)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Dependências Web
        run: npm install

      - name: Compilar Frontend Web
        run: npm run build

      - name: Sincronizar com Android
        run: npx cap sync android

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'gradle'

      - name: Conceder permissão de execução ao gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK Android TV
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../NovaIPTV-Pro.apk

      - name: Salvar APK nos Artefatos do GitHub (Download Seguro e Direto)
        uses: actions/upload-artifact@v4
        with:
          name: NovaIPTV-Pro-AndroidTV
          path: NovaIPTV-Pro.apk
          if-no-files-found: error

      - name: Publicar Release com APK para Download
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 NovaIPTV-Pro.apk \
            --title "Nova IPTV Pro v1.0.0 (Android TV APK)" \
            --notes "### 📺 Arquivo de Instalação Nova IPTV Pro\n\nBaixe o arquivo **NovaIPTV-Pro.apk** abaixo." \
            --clobber || true
